<!DOCTYPE html>
<html>
<head>
    <title>Concluir Reembolso</title>
</head>
<body>
    <h2>Concluir Reembolso para {{ reembolso.nome }}</h2>
    <p>Por favor, anexe o comprovante de reembolso.</p>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enviar Comprovante</button>
    </form>
</body>
</html>
